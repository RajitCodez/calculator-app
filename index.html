<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="splash-screen" id="splash-screen">
        <div class="splash-spacer"></div>
        <div class="splash-content">
            <h1>Modern Calculator</h1>
            <p>Simple • Fast • Accurate</p>
            <div class="math-loader">
                <div class="math-loader-bg-progress"></div>
                <div class="math-loader-chars" id="math-loader-chars"></div>
                <div class="math-loader-percent" id="math-loader-percent">0%</div>
            </div>
        </div>
        <div class="splash-footer">
            made with ❤️ by <a href="https://github.com/RajitCodez" target="_blank">Rajit</a>
        </div>
    </div>

    <div class="calculator" id="main-calculator">
        <div class="display" id="display-container">
            <div class="expression" id="expression">0</div>
            <div class="result-preview" id="result-preview"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="history-toggle" title="History">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="12 8 12 12 14 14"></polyline>
                    <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
                </svg>
            </button>
        </div>
        <div class="keypad-wrapper">
            <div class="keypad" id="keypad">
                <button class="btn ctrl-btn" data-action="clear">AC</button>
                <button class="btn ctrl-btn" data-action="delete">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
                <button class="btn ctrl-btn" data-action="sign">+/-</button>
                <button class="btn op-btn" data-operator="÷">÷</button>
                
                <button class="btn" data-number="7">7</button>
                <button class="btn" data-number="8">8</button>
                <button class="btn" data-number="9">9</button>
                <button class="btn op-btn" data-operator="×">×</button>
                
                <button class="btn" data-number="4">4</button>
                <button class="btn" data-number="5">5</button>
                <button class="btn" data-number="6">6</button>
                <button class="btn op-btn" data-operator="-">-</button>
                
                <button class="btn" data-number="1">1</button>
                <button class="btn" data-number="2">2</button>
                <button class="btn" data-number="3">3</button>
                <button class="btn op-btn" data-operator="+">+</button>
                
                <button class="btn" data-number="%">%</button>
                <button class="btn" data-number="0">0</button>
                <button class="btn" data-number=".">.</button>
                <button class="btn equals-btn" data-action="calculate">=</button>
            </div>
            
            <div class="history-panel" id="history-panel">
                <div class="history-list" id="history-list"></div>
                <button class="clear-history-btn" id="clear-history">Clear history</button>
            </div>
        </div>
    </div>

    <div class="main-footer" id="main-footer">
        made with ❤️ by <a href="https://github.com/RajitCodez" target="_blank">Rajit</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
